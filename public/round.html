<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Round</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="draft-header">
    <div class="header-left">
      <a class="back-link" id="back-link">← League</a>
      <h1 id="round-name">Loading…</h1>
      <span class="badge" id="round-status-badge"></span>
    </div>
    <div class="header-right">
      <span id="round-pts-summary" style="color:var(--text-muted);font-size:13px"></span>
    </div>
  </header>

  <div style="max-width:1100px;margin:0 auto;padding:16px">
    <div class="tab-nav" style="margin-top:0">
      <button class="tab-btn active" data-tab="stats">Player Stats</button>
      <button class="tab-btn" data-tab="teams">Team Breakdown</button>
    </div>

    <!-- Player Stats (stat entry + leaderboard) -->
    <div class="tab-panel active" id="tab-stats">
      <div id="commissioner-bar" style="display:none;margin-bottom:16px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)">
        <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
          <span style="font-size:13px;color:var(--text-muted)">Commissioner: enter stats per player</span>
          <input type="text" id="player-search" placeholder="Search player…" style="max-width:200px">
          <select id="team-filter-select" style="max-width:180px"><option value="">All Teams</option></select>
        </div>
      </div>
      <div id="stats-container"></div>
    </div>

    <!-- Team Breakdown -->
    <div class="tab-panel" id="tab-teams">
      <div id="teams-container"></div>
    </div>
  </div>

  <!-- Stat Entry Modal -->
  <div class="modal-overlay" id="stat-entry-modal" style="display:none">
    <div class="modal" style="min-width:340px;max-width:480px">
      <h3 id="stat-entry-title">Enter Stats</h3>
      <div id="stat-entry-fields" style="margin-top:16px;display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto"></div>
      <div id="stat-entry-preview" style="margin-top:12px;padding:10px;background:var(--surface2);border-radius:var(--radius-sm);font-size:13px;display:none">
        <strong>Estimated Points:</strong> <span id="preview-pts">—</span>
        <div id="preview-breakdown" style="color:var(--text-muted);font-size:12px;margin-top:4px"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="stat-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="stat-save-btn">Save Stats</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/round.js" type="module"></script>
</body>
</html>

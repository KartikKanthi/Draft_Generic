<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="draft-header">
    <div class="header-left">
      <a href="/" class="back-link">← Home</a>
      <h1 id="league-name">Loading…</h1>
      <span class="badge badge-blue" id="sport-badge" style="display:none"></span>
    </div>
    <div class="header-right">
      <button class="btn btn-sm" id="settings-btn" style="display:none">⚙ Scoring Rules</button>
      <button class="btn btn-sm btn-primary" id="add-round-btn" style="display:none">+ New Round</button>
    </div>
  </header>

  <div style="max-width:1000px;margin:0 auto;padding:16px">
    <div class="tab-nav" style="margin-top:0">
      <button class="tab-btn active" data-tab="standings">Standings</button>
      <button class="tab-btn" data-tab="rounds">Rounds</button>
      <button class="tab-btn" data-tab="my-team">My Team</button>
      <button class="tab-btn" data-tab="trades">Trades</button>
      <button class="tab-btn" data-tab="waivers">Waivers</button>
    </div>

    <!-- Standings -->
    <div class="tab-panel active" id="tab-standings">
      <div id="standings-container"></div>
    </div>

    <!-- Rounds -->
    <div class="tab-panel" id="tab-rounds">
      <div id="rounds-container"></div>
    </div>

    <!-- My Team -->
    <div class="tab-panel" id="tab-my-team">
      <div id="my-team-container">
        <div style="color:var(--text-muted);padding:24px;text-align:center">
          Select your team below to view your roster and points.
        </div>
        <div id="team-selector" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px"></div>
        <div id="team-detail"></div>
      </div>
    </div>

    <!-- Trades -->
    <div class="tab-panel" id="tab-trades">
      <div id="trades-container"></div>
    </div>

    <!-- Waivers -->
    <div class="tab-panel" id="tab-waivers">
      <div id="waivers-container"></div>
    </div>
  </div>

  <!-- Lineup Modal -->
  <div class="modal-overlay" id="lineup-modal" style="display:none">
    <div class="modal" style="min-width:340px;max-width:520px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <h3 id="lineup-modal-title">Set Lineup</h3>
        <span id="lineup-counter" class="badge badge-muted">0 / 11</span>
      </div>
      <p style="color:var(--text-muted);font-size:13px;margin-bottom:12px">
        Click players to toggle starter / bench. Only starters score this round.
      </p>
      <div id="lineup-player-list" style="display:flex;flex-direction:column;gap:6px;max-height:50vh;overflow-y:auto"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn" id="lineup-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="lineup-save-btn">Save Lineup</button>
      </div>
    </div>
  </div>

  <!-- Add Round Modal -->
  <div class="modal-overlay" id="round-modal" style="display:none">
    <div class="modal">
      <h3>New Round</h3>
      <div style="margin-top:16px;display:flex;flex-direction:column;gap:12px">
        <div class="form-group">
          <label>Round Name</label>
          <input type="text" id="round-name-input" placeholder="Week 1, Gameweek 3…">
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="round-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="round-confirm-btn">Create Round</button>
      </div>
    </div>
  </div>

  <!-- Trade Proposal Modal -->
  <div class="modal-overlay" id="trade-modal" style="display:none">
    <div class="modal" style="min-width:360px;max-width:640px;width:90vw">
      <h3>Propose Trade</h3>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:12px">
        <div class="form-group">
          <label>Trade With</label>
          <select id="trade-team-select" style="width:100%;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            <option value="">Select a team…</option>
          </select>
        </div>
        <div id="trade-player-section" style="display:none;flex-direction:column;gap:12px">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
            <div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">You Offer</div>
              <div id="trade-offer-list" style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto"></div>
            </div>
            <div>
              <div style="font-size:12px;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em">You Want</div>
              <div id="trade-request-list" style="display:flex;flex-direction:column;gap:4px;max-height:220px;overflow-y:auto"></div>
            </div>
          </div>
          <div class="form-group" style="margin:0">
            <label style="font-size:13px">Note (optional)</label>
            <input type="text" id="trade-note-input" placeholder="Add a message…">
          </div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="trade-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="trade-submit-btn" disabled>Propose Trade</button>
      </div>
    </div>
  </div>

  <!-- Waiver Claim Modal -->
  <div class="modal-overlay" id="waiver-modal" style="display:none">
    <div class="modal" style="min-width:320px;max-width:480px">
      <h3>Claim Player</h3>
      <div style="margin-top:14px;display:flex;flex-direction:column;gap:12px">
        <div id="waiver-claim-player-info" style="padding:10px 14px;background:var(--surface-2);border-radius:6px;border:1px solid var(--border)"></div>
        <div class="form-group" style="margin:0">
          <label>Drop Player (optional)</label>
          <select id="waiver-drop-select" style="width:100%;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;color:var(--text)">
            <option value="">None — keep full squad</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="waiver-cancel-btn">Cancel</button>
        <button class="btn btn-primary" id="waiver-submit-btn">Submit Claim</button>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/league.js" type="module"></script>
</body>
</html>
